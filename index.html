<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ana Julia</title>
    <style>
        body {
            /* Aqui chamamos a sua foto de fundo */
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #fce4ec; /* Cor de reserva */
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Camada escura opcional para o texto aparecer melhor sobre a foto */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3); 
            z-index: -1;
        }

        .container-envelope {
            text-align: center;
            cursor: pointer;
            z-index: 10;
        }

        .envelope {
            font-size: 80px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
        }

        .texto-clique {
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        #conteudo-presente {
            display: none;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 85%;
            max-width: 400px;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 { color: #d81b60; margin-bottom: 15px; }
        p { color: #333; font-size: 18px; line-height: 1.5; }

        .foto-interna {
            width: 100%;
            border-radius: 15px;
            margin-top: 15px;
        }

        button {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container-envelope" id="carta-inicial" onclick="abrirCarta()">
        <div class="envelope">✉️</div>
        <p class="texto-clique">Clique para abrir a sua surpresa, amor</p>
    </div>

    <div id="conteudo-presente">
        <h1>Para Ana Julia</h1>
        <p>Você é a pessoa mais especial da minha vida. Preparei isso com todo carinho para você!</p>
        
        <img src="foto_interna.jpg" alt="Ana Julia" class="foto-interna">
        
        <button onclick="window.location.reload()">Ver de novo</button>
    </div>

    <audio id="musica" src="musica.mp3"></audio>

    <script>
        function abrirCarta() {
            // Toca a música
            const music = document.getElementById('musica');
            music.play();

            // Faz a carta sumir
            document.getElementById('carta-inicial').style.display = 'none';
            
            // Mostra o conteúdo no centro
            document.getElementById('conteudo-presente').style.display = 'block';
        }
    </script>
</body>
</html>
